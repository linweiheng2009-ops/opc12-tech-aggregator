name: Daily OPC12 Tech Aggregator Fetch

on:
  # 每天 UTC 00:00 / SGT 08:00 跑一次
  schedule:
    - cron: '0 0 * * *'
  # 允许手动触发（调试用）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-tech-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run crawler (5 sources × 2 = 10 items/day)
        run: |
          python scripts/00_fetch.py
          echo "---"
          echo "今日条数:"
          python -c "
          import json, sys
          from datetime import datetime
          today = datetime.now().strftime('%Y-%m-%d')
          d = json.load(open(f'data/{today}.json'))
          print(f'  {d[\"total\"]} 条 / 5 源')
          for s in d['sources']:
            print(f'  {s[\"label\"]}: {s[\"count\"]} 条')
          if d['total'] < 10:
            print(f'⚠️ 未达标 ({d['\''total'\'']}/10)')
            sys.exit(1)
          "

      - name: Translate English items to Chinese (Google Translate free)
        run: |
          python scripts/03_translate.py || echo "⚠️ 翻译失败，原条目保留英文"

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "data: daily snapshot $DATE"
            git push
          fi